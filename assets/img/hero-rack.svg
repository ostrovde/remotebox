<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img"
     aria-label="Illustration: a server rack, an uptime counter, a memory gauge and a lock">
  <defs>
    <linearGradient id="hBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="hRack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152a4a"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="hBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="hSoft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1220" flood-opacity=".16"/>
    </filter>
    <pattern id="hDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#2563eb" opacity=".2"/>
    </pattern>
  </defs>

  <rect width="1120" height="620" fill="none"/>
  <circle cx="800" cy="300" r="290" fill="url(#hBlob)"/>
  <rect x="40" y="46" width="220" height="140" fill="url(#hDots)" opacity=".8"/>

  <g filter="url(#hSoft)">
    <rect x="600" y="150" width="330" height="330" rx="26" fill="url(#hRack)"/>
    <g fill="#38bdf8">
      <rect x="636" y="186" width="258" height="52" rx="12" opacity=".92"/>
      <rect x="636" y="252" width="258" height="52" rx="12" opacity=".78"/>
      <rect x="636" y="318" width="258" height="52" rx="12" opacity=".62"/>
      <rect x="636" y="384" width="258" height="52" rx="12" opacity=".46"/>
    </g>
    <g fill="#0b1220">
      <circle cx="668" cy="212" r="8"/><circle cx="668" cy="278" r="8"/>
      <circle cx="668" cy="344" r="8"/><circle cx="668" cy="410" r="8"/>
    </g>
    <g fill="#0b1220" opacity=".38">
      <rect x="694" y="206" width="120" height="12" rx="6"/>
      <rect x="694" y="272" width="94" height="12" rx="6"/>
      <rect x="694" y="338" width="140" height="12" rx="6"/>
      <rect x="694" y="404" width="106" height="12" rx="6"/>
    </g>
  </g>

  <g filter="url(#hSoft)">
    <rect x="96" y="236" width="270" height="92" rx="18" fill="#fff" stroke="#e3e8ef"/>
    <text x="122" y="268" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="24"
          fill="#5b6675" letter-spacing="1">UPTIME</text>
    <text x="122" y="308" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="44"
          font-weight="700" fill="#0b1220">99.9%</text>
    <rect x="270" y="292" width="72" height="12" rx="6" fill="#eef2f9"/>
    <rect x="270" y="292" width="58" height="12" rx="6" fill="url(#hBar)"/>
  </g>

  <g filter="url(#hSoft)">
    <rect x="140" y="356" width="270" height="92" rx="18" fill="#fff" stroke="#e3e8ef"/>
    <text x="166" y="388" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="24"
          fill="#5b6675" letter-spacing="1">RAM USED</text>
    <text x="166" y="428" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="40"
          font-weight="700" fill="#0f7b46">2.4 GB</text>
    <rect x="314" y="412" width="72" height="12" rx="6" fill="#eef2f9"/>
    <rect x="314" y="412" width="30" height="12" rx="6" fill="#22c55e"/>
  </g>

  <g filter="url(#hSoft)" transform="translate(490 470)">
    <path d="M0-52l60 26v48c0 34-24 58-60 66-36-8-60-32-60-66v-48z" fill="#2563eb"/>
    <rect x="-22" y="-6" width="44" height="34" rx="7" fill="#fff"/>
    <path d="M-13-6v-10a13 13 0 0 1 26 0v10" fill="none" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
