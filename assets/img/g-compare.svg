  <g filter="url(#cS)">
    <rect x="110" y="70" width="300" height="180" rx="22" fill="#fff" stroke="#e3e8ef"/>
    <rect x="142" y="102" width="80" height="58" rx="10" fill="url(#cB)"/>
    <rect x="142" y="176" width="236" height="12" rx="6" fill="#c9d5e6"/>
    <rect x="142" y="200" width="170" height="12" rx="6" fill="#e2e9f3"/>
    <text x="142" y="150" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#0b1220">  RDP</text>
  </g>
  <g filter="url(#cS)">
    <rect x="450" y="70" width="300" height="180" rx="22" fill="#fff" stroke="#e3e8ef"/>
    <rect x="482" y="102" width="80" height="58" rx="10" fill="url(#cT)"/>
    <rect x="482" y="176" width="236" height="12" rx="6" fill="#c9d5e6"/>
