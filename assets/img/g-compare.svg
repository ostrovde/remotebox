    <rect x="822" y="176" width="236" height="12" rx="6" fill="#c9d5e6"/>
    <rect x="822" y="200" width="150" height="12" rx="6" fill="#e2e9f3"/>
    <text x="822" y="150" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#0b1220">  Dedicated</text>
  </g>
