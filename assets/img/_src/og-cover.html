<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RemoteBox og-cover source</title>
<!-- Rendered to assets/img/og-cover.png (1200x630) with Edge headless:
     msedge --headless --disable-gpu --hide-scrollbars --window-size=1200,630
            --screenshot=../og-cover.png og-cover.html -->
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#0a1428;color:#fff;position:relative}
  .glow{position:absolute;border-radius:50%}
  .g1{width:760px;height:760px;right:-240px;top:-300px;
      background:radial-gradient(circle,rgba(37,99,235,.85),rgba(37,99,235,0) 66%)}
  .g2{width:600px;height:600px;left:-240px;bottom:-320px;
      background:radial-gradient(circle,rgba(56,189,248,.5),rgba(56,189,248,0) 66%)}
  .inner{position:relative;height:100%;padding:54px 68px 48px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;letter-spacing:-.02em}
  .mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#1e3a8a,#38bdf8);
        display:grid;place-items:center;font-size:24px}
  .brand em{font-style:normal;color:#7dd3fc}
  h1{font-size:52px;line-height:1.1;letter-spacing:-.03em;margin-top:44px;max-width:21ch}
  h1 u{text-decoration:none;background:linear-gradient(90deg,#7dd3fc,#38bdf8);
      -webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:20px;font-size:23px;color:#a9bcd6;max-width:40ch}
  .row{margin-top:42px;display:flex;align-items:center;gap:13px}
  .pill{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 20px;
        font-size:20px;color:#d7e5f7}
  .tag{margin-left:auto;font-size:20px;color:#7f97b5;text-align:right;line-height:1.4}
  .tag b{color:#fff;display:block;font-size:24px}
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="inner">
    <div class="brand"><span class="mark">▣</span>Remote<em>Box</em></div>
    <h1>Remote machines, <u>sized for what you actually run</u></h1>
    <p>How much RAM a scraper needs, what 24/7 automation costs, and how to secure the box.</p>
    <div class="row">
      <span class="pill">Sized for real workloads</span>
      <span class="pill">No paid placements</span>
      <span class="tag"><b>Working notes</b>for people who run bots</span>
    </div>
  </div>
</body>
</html>
